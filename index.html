<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main">
        <div id="heading">
            <h1>Real-time character counter</h1>
        </div>
        <div>
            <textarea id="textarea" rows="5" cols="50" maxlength="100" placeholder="Write your text here"></textarea>
        </div>
        <div id="total-counter">
            <p>Total count: 0</p>
        </div>
        <div id="remaining-counter">
            <p>Remaining count: 100</p>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
